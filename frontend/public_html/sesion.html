<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrativo - El Punto</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="body-admin">

    <main class="contenedor-login">
        <div class="tarjeta-login">
            
            <div class="logo-admin">
                <h2>El Punto</h2>
                <p>Panel Administrativo</p>
            </div>

            <!-- El action está vacío por ahora hasta que se conecte el backend -->
            <form action="#" method="POST" class="formulario-admin">
                <div class="grupo-input">
                    <label for="usuario">Usuario</label>
                    <input type="text" id="usuario" name="usuario" required placeholder="Ingresa tu usuario">
                </div>

                <div class="grupo-input">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="contacto-button btn-login">Iniciar Sesión</button>
            </form>

            <div class="enlaces-login">
                <a href="index.html">← Volver al sitio principal</a>
            </div>

        </div>
    </main>

</body>
</html>
